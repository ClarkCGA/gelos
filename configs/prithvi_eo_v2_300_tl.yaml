experiment_name: "Prithvi EO V2 300M TL (time + location)"
data_version: "v0.50.1"
chip_tracker: "gelos_chip_tracker.geojson"
chip_id_column: "id"

seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  callbacks: []
  max_epochs: 0

data:
  class_path: gelos.gelosdatamodule.GELOSDataModule
  init_args:
    # The dataset class MUST override both metadata hooks:
    #   _get_timestamps(index) -> (T, 3) int [year, month, day]
    #   _get_location(index)   -> (2,) float [lat, lon]
    # PrithviTLBackbone raises at the first forward pass if either
    # batch["timestamps"] or batch["location"] is missing -- TL embeddings are
    # never silently skipped (the stock terratorch name `prithvi_eo_v2_300_tl`
    # WOULD silently skip them; do not use it in gelos).
    dataset_class: gelos.gelosdataset.GELOSDataSet
    batch_size: 8
    num_workers: 4
    # Prithvi's six HLS bands. means/stds are injected automatically from
    # Prithvi's pretraining statistics (gelos.normalization) -- do not set them
    # here unless you intend to override.
    bands:
      S2L2A:
        - BLUE
        - GREEN
        - RED
        - NIR_NARROW
        - SWIR_1
        - SWIR_2
    transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: albumentations.augmentations.geometric.resize.Resize
        init_args:
          height: 96
          width: 96
          interpolation: 0 # Nearest Neighbor
      - class_path: albumentations.pytorch.transforms.ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args:
          n_timesteps: 4
model:
  class_path: terratorch.tasks.EmbeddingGenerationTask
  title: Prithvi EO V2 300M TL
  init_args:
    # gelos-registered wrapper (gelos.backbones.prithvi_tl_backbone) that feeds
    # temporal_coords / location_coords to the terratorch TL encoder.
    model: prithvi_eo_v2_300_tl_coords
    model_args:
      pretrained: true
      bands:
        - BLUE
        - GREEN
        - RED
        - NIR_NARROW
        - SWIR_1
        - SWIR_2
    output_format: parquet
    embed_file_key: filename
    layers: [-1] # Model layers to extract embeddings from, -1 means the last layer
    embedding_pooling: null
    has_cls: true
    temporal_cfg:
      # temporal_wrapper: true encodes each timestep on its own (CLS at index 0),
      # matching the token layout of the plain Prithvi baseline
      # (configs/prithvi_eo_v2_300.yaml) so the comparison is like-for-like.
      temporal_wrapper: true
      temporal_pooling: keep

# each strategy defines extraction args (slice_args) and optional analysis steps
embedding_extraction_strategies:
  all_embeddings:
    title: "All Embeddings"
    slice_args:
      - start: 0
        stop: null
        step:
    transforms:
      - type: pca
        params:
          n_components: 2

style:
  category_column: "lulc"
  colors:
    "1": "#419bdf"    # Water
    "2": "#397d49"    # Trees
  labels:
    "1": "Water"
    "2": "Trees"
