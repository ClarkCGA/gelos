experiment_name: "OlmoEarth V1 Base S2+S1 - Example"
data_version: "v0.50.1"
chip_tracker: "gelos_chip_tracker.geojson"
chip_id_column: "id"

seed_everything: 0
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  callbacks: []
  max_epochs: 0

data:
  class_path: gelos.gelosdatamodule.GELOSDataModule
  init_args:
    dataset_class: tests.test_data.ExampleGELOSDataSet
    batch_size: 1
    num_workers: 0
    # NOTE: This fixture is for structural YAML validation only; it requires the
    # production 12-band GELOS-LC dataset for live inference. ExampleGELOSDataSet
    # defines only 11 S2L2A bands and lacks WATER_VAPOR (B09), which OlmoEarth
    # requires. A real smoke run therefore needs a dataset that supplies the full
    # 12-band S2L2A set and S1RTC with VV/VH bands in decibel scale.
    # NOTE: S1 data must be in decibel scale (VV mean≈-11.6 dB, VH mean≈-17.7 dB).
    bands:
      S2L2A:
        - coastal
        - blue
        - green
        - red
        - rededge1
        - rededge2
        - rededge3
        - nir
        - nir08
        - swir16
        - swir22
      S1RTC:
        - VV
        - VH
    transform:
      - class_path: terratorch.datasets.transforms.FlattenTemporalIntoChannels
      - class_path: albumentations.augmentations.geometric.resize.Resize
        init_args:
          height: 96
          width: 96
          interpolation: 0 # Nearest Neighbor
      - class_path: albumentations.pytorch.transforms.ToTensorV2
      - class_path: terratorch.datasets.transforms.UnflattenTemporalFromChannels
        init_args:
          n_timesteps: 4
model:
  class_path: terratorch.tasks.EmbeddingGenerationTask
  title: OlmoEarth V1 Base S2+S1
  init_args:
    model: olmoearth_v1_base_s1s2  # registered via gelos.backbones.olmoearth_backbone
    model_args:
      model_id: allenai/OlmoEarth-v1-Base
      pretrained: True
      patch_size: 4
      bands:
        - coastal
        - blue
        - green
        - red
        - rededge1
        - rededge2
        - rededge3
        - nir
        - nir08
        - swir16
        - swir22
      # S1 bands in the order the incoming tensor presents them.
      # NOTE: S1 data must be in decibel scale.
      bands_s1:
        - VV
        - VH
    output_format: parquet
    embed_file_key: filename
    layers: [-1]
    embedding_pooling: null
    has_cls: False
    # NOTE: no temporal_cfg block. temporal_wrapper must be off for OlmoEarth —
    # TemporalWrapper flattens (B,C,T,H,W) to 4D, but OlmoEarthBackbone requires
    # the 5D temporal tensor (and per-timestep (B,T,3) timestamps).

embedding_extraction_strategies:
  all_embeddings:
    title: "All Embeddings"
    slice_args:
      - start: 0
        stop: null
        step:
    transforms:
      - type: pca
        params:
          n_components: 2

style:
  category_column: "lulc"
  colors:
    "1": "#419bdf"
    "2": "#397d49"
  labels:
    "1": "Water"
    "2": "Trees"
