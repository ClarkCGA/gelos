services:
  test:
    image: gelos-test:latest
    build:
      context: .
      target: test
    volumes:
      - ./gelos:/app/gelos
      - ./tests:/app/tests
  test-ci:
    image: gelos-test-ci:latest
    build:
      context: .
      target: test
  prod:
    image: gelos-prod:latest
    build:
      context: .
      target: prod