[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "gelos"
version = "0.3.7"
description = "Repository for Geospatial Exploration of Latent Observation Space (GELOS)"
authors = [
  { name = "Denys Godwin" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"
dependencies = [
    "terratorch==1.1.1",
    "pyarrow>=23",
    "typer",
    "tqdm",
    "numpy>=1.26,<3",
    "pandas>=3.0,<4",
    "matplotlib>=3.10",
    "rioxarray>=0.19",
    "scikit-learn>=1.8,<2",
    "geopandas>=1.1",
    "pillow",
    "timm>=1.0",
    "einops",
    "loguru",
    "umap-learn>=0.5,<0.6",
    "zarr>=3.0",
    "olmoearth-pretrain>=0.1.0",
]

[project.optional-dependencies]
# s3fs<2024.6 ships with aiobotocore<2.13 which lacks the `asynchronous` kwarg
# added to botocore.Session.__init__ in botocore 1.34.51 — bound prevents that
# version-skew TypeError in downstream pip installs.
alphaearth = ["s3fs>=2024.6.0", "zarr>=3.0"]

[tool.ruff]
line-length = 99
src = ["gelos"]
include = ["pyproject.toml", "gelos/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["gelos"]
force-sort-within-sections = true
